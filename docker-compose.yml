services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - blaeu_data:/data
    environment:
      - DATA_DIR=/data
      - BLAEU_ALLOW_REGISTRATION=${BLAEU_ALLOW_REGISTRATION:-false}
      - BLAEU_WORKERS=${BLAEU_WORKERS:-2}
      - CARTO_API_KEY=${CARTO_API_KEY:-}
      - BLAEU_OVERPASS_TIMEOUT=${BLAEU_OVERPASS_TIMEOUT:-180}
      - BLAEU_OVERPASS_URL=${BLAEU_OVERPASS_URL:-}
      - BLAEU_WORKER_TIMEOUT=${BLAEU_WORKER_TIMEOUT:-300}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M

volumes:
  blaeu_data:
    driver: local
