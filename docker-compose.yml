services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - blaeu_data:/data
    environment:
      - DATA_DIR=/data
      - BLAEU_ALLOW_REGISTRATION=${BLAEU_ALLOW_REGISTRATION:-false}
      - BLAEU_WORKERS=${BLAEU_WORKERS:-2}
      - CARTO_API_KEY=${CARTO_API_KEY:-}
      - BLAEU_OVERPASS_TIMEOUT=${BLAEU_OVERPASS_TIMEOUT:-180}
      - BLAEU_OVERPASS_URL=${BLAEU_OVERPASS_URL:-}
      - BLAEU_WORKER_TIMEOUT=${BLAEU_WORKER_TIMEOUT:-300}
      - BLAEU_OVERPASS_MIN_INTERVAL=${BLAEU_OVERPASS_MIN_INTERVAL:-5}
      - BLAEU_POSTER_MAX_ATTEMPTS=${BLAEU_POSTER_MAX_ATTEMPTS:-5}
      - BLAEU_THREADS=${BLAEU_THREADS:-8}
      # AI coach defaults; admins can also configure the endpoint in Settings > Admin
      - BLAEU_LLM_BASE_URL=${BLAEU_LLM_BASE_URL:-}
      - BLAEU_LLM_MODEL=${BLAEU_LLM_MODEL:-}
      - BLAEU_LLM_API_KEY=${BLAEU_LLM_API_KEY:-}
      - BLAEU_LLM_ENABLED=${BLAEU_LLM_ENABLED:-false}
      - BLAEU_LLM_CONTEXT_WINDOW=${BLAEU_LLM_CONTEXT_WINDOW:-8192}
      - BLAEU_LLM_REASONING=${BLAEU_LLM_REASONING:-}
      - BLAEU_LLM_EMBEDDING_MODEL=${BLAEU_LLM_EMBEDDING_MODEL:-}
      - BLAEU_LLM_EMBEDDING_BASE_URL=${BLAEU_LLM_EMBEDDING_BASE_URL:-}
      - BLAEU_LLM_LIBRARY_SEARCH=${BLAEU_LLM_LIBRARY_SEARCH:-auto}
      - BLAEU_LLM_DATA_TOOLS=${BLAEU_LLM_DATA_TOOLS:-auto}
    # Lets the container reach an LLM (e.g. Ollama) on the host at host.docker.internal, also on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M

volumes:
  blaeu_data:
    driver: local
